<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ville ODICOLOR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Concept : maquette de nuit posée sur un bureau sombre. Néon rouge ODICOLOR au centre,
   indicateurs en haut, un onglet = un écran (Ville / Carte / Simulation). Violet réservé à la simulation. */
:root{
  --fond:#0A0B0D; --plateau:#111317; --carte:#16191E; --carte-2:#1C2026; --trait:#272C33;
  --texte:#F4F2EF; --doux:#9EA3AB; --gris:#6E737B;
  --rouge:#D41F2B; --neon:#FF2D3D; --rouge-doux:#FF8A92;
  --vert:#2FB86C; --bleu:#3E86F0; --orange:#F0952B; --danger:#F0343F; --sim:#8B5CF6; --sim-doux:#C4B0FF;
  --nuit-sol:#1C212A; --nuit-bord:#252B34; --herbe:#16281D; --route:#272C34; --route-bord:#2E333B; --lampe:#FFC873; --vitre:#FFD27A;
  --f-titre:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-texte:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--fond);color:var(--texte)}
body{font-family:var(--f-texte);font-size:15px;line-height:1.45;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--fond)}
.gouttiere{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
.entete{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,11,13,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--trait)}
.entete-l1{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.marque{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF4A55,var(--rouge) 60%,#8C0F17);display:grid;place-items:center;flex:none;box-shadow:0 0 14px rgba(255,45,61,.45)}
.logo span{width:16px;height:16px;border:3.5px solid #fff;border-radius:50%}
.marque-txt b{font-family:var(--f-titre);font-weight:800;font-size:24px;letter-spacing:.01em;line-height:1;font-style:italic}
.marque-txt b em{color:var(--neon);font-style:italic}
.marque-txt small{display:block;color:var(--doux);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.onglets{display:flex;gap:4px;margin-left:8px}
.onglet{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;background:none;color:var(--doux);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.onglet:hover{color:var(--texte);background:var(--carte)}
.onglet[aria-current="page"]{background:var(--rouge);color:#fff;box-shadow:0 0 16px rgba(226,27,42,.35)}
.onglet.sim[aria-current="page"]{background:var(--sim);box-shadow:0 0 16px rgba(139,92,246,.35)}
.onglet svg{width:16px;height:16px}
.outils{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
.cherche{position:relative;min-width:0}
.cherche input{width:min(280px,46vw);min-height:40px;border-radius:8px;border:1px solid var(--trait);background:var(--plateau);color:var(--texte);padding:0 12px 0 34px}
.cherche>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--doux)}
.resultats{position:absolute;right:0;top:calc(100% + 6px);width:min(340px,90vw);background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:6px;z-index:70;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:4px}
.mode{font-family:var(--f-titre);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;padding:0 12px;min-height:40px;border-radius:8px;border:1px solid var(--orange);color:var(--orange);background:none;cursor:pointer;white-space:nowrap}
.mode.reel{border-color:var(--vert);color:var(--vert)}
.donnees{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 6px);width:min(360px,calc(100vw - 32px));z-index:70}
@media (max-width:720px){.onglets{order:3;width:100%;margin-left:0}.onglet{flex:1;justify-content:center;padding:0 8px}.cherche input{width:40vw}}
@media (max-width:480px){.onglet svg{display:none}.onglet{padding:0 4px;font-size:14px}}

/* Indicateurs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding-block:14px 4px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{display:flex;gap:12px;align-items:center;background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .ic{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;background:rgba(226,27,42,.12);color:var(--neon)}
.kpi .ic svg{width:21px;height:21px}
.kpi .l{color:var(--doux);font-size:12.5px;line-height:1.2}
.kpi .v{font-family:var(--f-titre);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v.petit{font-size:17px;font-weight:700;color:var(--gris)}
.kpi .s{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:11.5px;color:var(--doux)}
.kpi>div{min-width:0}
@media (max-width:560px){.kpi .ic{display:none}.kpi{padding:10px 12px}}

.badge{font-family:var(--f-titre);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;white-space:nowrap}
.b-demo{background:rgba(240,149,43,.16);color:var(--orange)}
.b-terrain{background:rgba(62,134,240,.16);color:#8FB6F5}
.b-confirme{background:rgba(47,184,108,.16);color:#71DBA0}
.b-estime{background:rgba(158,163,171,.15);color:var(--doux)}
.b-alerte{background:rgba(240,52,63,.16);color:var(--rouge-doux)}
.b-sim{background:rgba(139,92,246,.18);color:var(--sim-doux)}
.b-vide{background:transparent;color:var(--gris);border:1px dashed var(--trait)}

/* Filtres */
.barre-filtres{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px}
.barre-filtres:empty{display:none}
.puce{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--trait);background:var(--carte);color:var(--texte);cursor:pointer;font-size:14px;font-weight:500}
.puce i{width:10px;height:10px;border-radius:50%}
.puce[aria-pressed="true"]{border-color:var(--texte)}
.puce[aria-pressed="false"]{opacity:.55}
.puce.tous[aria-pressed="true"]{background:var(--rouge);border-color:var(--rouge);color:#fff}

/* Écran Ville */
.ecran{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start;padding-block:0 16px}
@media (max-width:980px){.ecran{grid-template-columns:minmax(0,1fr)}}
.maquette{position:relative;border:1px solid var(--trait);border-radius:14px;overflow:hidden;min-width:0;
  background:radial-gradient(ellipse 70% 60% at 50% 48%,#1A1E26 0%,#101217 55%,var(--fond) 100%)}
.scene{overflow-x:auto}
.maquette svg{display:block;width:100%;height:auto;max-height:78vh}
@media (max-width:700px){.maquette svg{width:900px;max-height:none}}
.legende{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-top:1px solid var(--trait);font-size:13px;color:var(--doux);background:rgba(10,11,13,.6)}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{width:10px;height:10px;border-radius:50%;display:inline-block}
.terr{cursor:pointer}
.terr .bati{transition:transform .25s ease}
.terr:hover .bati,.terr:focus .bati,.terr.choisi .bati{transform:translateY(-5px)}
.terr:focus{outline:none}
.terr.choisi .socle{stroke:var(--neon);stroke-width:2.5}
.agent{animation:balance 2.6s ease-in-out infinite}
@keyframes balance{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.vehicule{animation:rouler var(--d,10s) linear infinite alternate}
@keyframes rouler{0%{offset-distance:0%}100%{offset-distance:100%}}
.neon{animation:clignote 5s ease-in-out infinite}
@keyframes clignote{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}97%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.agent,.vehicule,.neon{animation:none}.terr .bati{transition:none}}
.c-nom{font:700 14px var(--f-titre);fill:var(--texte);letter-spacing:.02em}
.c-txt{font:500 11px var(--f-texte);fill:var(--doux)}

.panneau{display:flex;flex-direction:column;gap:12px;min-width:0}
.bloc{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:16px;min-width:0}
.bloc h2{font-family:var(--f-titre);font-weight:800;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.sous{color:var(--doux);margin:2px 0 0;font-size:14px}
.titre-bloc{font-family:var(--f-titre);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--doux)}
.chiffres{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.chiffre{background:var(--plateau);border-radius:10px;padding:10px 12px;min-width:0}
.chiffre .v{font-family:var(--f-titre);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.chiffre .l{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--doux);font-size:12.5px;margin-top:4px}
.dep-resume{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px dashed var(--trait);font-size:14px}
.dep-resume small{display:block;color:var(--doux);font-size:12.5px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--trait);background:var(--carte-2);color:var(--texte);font-weight:600;cursor:pointer;text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover:not(:disabled){border-color:var(--doux)}
.btn:disabled{opacity:.45;cursor:default}
.btn.principal{background:var(--rouge);border-color:var(--rouge);color:#fff;font-family:var(--f-titre);font-size:18px;letter-spacing:.03em;min-height:52px;box-shadow:0 0 18px rgba(226,27,42,.3)}
.btn.principal:hover:not(:disabled){background:var(--neon)}
.btn.plein{width:100%;margin-top:14px}
.btn.discret{background:transparent}
.regle{font-size:12.5px;color:var(--doux);margin:12px 0 0}
.info{font-size:13.5px;color:var(--doux)}
.info b{color:var(--texte)}
.message{font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--plateau);border-left:3px solid var(--vert)}
.message.erreur{border-left-color:var(--danger)}
.import{display:flex;flex-direction:column;gap:8px}
.import input{position:absolute;opacity:0;width:1px;height:1px}
.deps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.dep{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;
  min-height:54px;padding:8px 28px 8px 10px;border-radius:9px;border:1px solid var(--trait);background:var(--plateau);color:var(--texte);cursor:pointer}
.dep:hover:not(:disabled){border-color:var(--doux)}
.dep:disabled{opacity:.45;cursor:default}
.dep-n{grid-row:1/3;font-family:var(--f-titre);font-weight:800;font-size:24px;color:var(--neon);font-variant-numeric:tabular-nums}
.dep-nom{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep-c{color:var(--doux);font-size:12px}
.dep-alerte{position:absolute;top:6px;right:6px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font:800 12px var(--f-titre);display:grid;place-items:center;padding:0 5px}
.a-classer .dep-n{color:var(--orange)}

/* Fil d'actions */
.fil-actions{border:1px solid var(--trait);border-radius:14px;background:var(--carte);padding:12px 14px 14px;margin-block:0 20px}
.fil-tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fil-tete h3{font-family:var(--f-titre);font-weight:700;font-size:20px;margin:0}
.fil-liste{display:flex;gap:10px;overflow-x:auto;padding-top:12px;scroll-snap-type:x mandatory}
.evt{flex:0 0 210px;scroll-snap-align:start;display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--plateau);border:1px solid var(--trait);border-radius:10px;padding:10px;color:var(--texte);cursor:pointer}
.evt:hover{border-color:var(--doux)}
.evt .pastille{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center}
.evt .pastille svg{width:17px;height:17px}
.evt small{display:block;color:var(--doux);font-size:11.5px}
.evt b{display:block;font-size:13.5px;line-height:1.2;margin-top:1px}
.evt>span{min-width:0}
.evt .g{font-size:12.5px;color:var(--doux);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.b-annuaire{background:rgba(201,205,211,.14);color:#E4E7EB;border:1px solid rgba(201,205,211,.35)}
.marche .chiffres{margin-top:10px}
.test-ok{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--plateau);display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.test-ok small{color:var(--doux)}
.progression{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--doux)}
.progression .barre{height:8px;border-radius:4px;background:var(--trait);overflow:hidden}
.progression .barre i{display:block;height:100%;background:var(--neon);transition:width .2s}
.indic-commune{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px dashed var(--trait)}
.indic-commune small{display:block;color:var(--doux);font-size:12px}
.gros-chiffre{font-family:var(--f-titre);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.ligne .rang{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--rouge);color:#fff;font:800 13px var(--f-titre)}
.vignette.annuaire{color:var(--doux)}
.vignette.annuaire svg{width:34px;height:34px}
/* Carte réelle */
.zone-carte{position:relative;border:1px solid var(--trait);border-radius:14px;overflow:hidden;background:var(--plateau);min-width:0}
#carte{height:min(66vh,600px);width:100%}
.avis-tuiles{position:absolute;left:12px;right:12px;bottom:12px;z-index:900;background:rgba(10,11,13,.95);border:1px solid var(--trait);border-radius:8px;padding:10px 12px;font-size:13.5px}
.avis-tuiles a{color:var(--rouge-doux)}
.recherche{width:100%;min-height:44px;border-radius:8px;border:1px solid var(--trait);background:var(--plateau);color:var(--texte);padding:0 12px}
select.recherche{appearance:auto}
.champs-filtre{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.liste{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto;margin-top:10px}
.ligne{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:50px;padding:8px 10px;border-radius:9px;border:1px solid transparent;background:var(--plateau);color:var(--texte);cursor:pointer}
.ligne:hover{border-color:var(--trait)}
.ligne i{width:10px;height:10px;border-radius:50%;flex:none}
.ligne span{min-width:0;flex:1}
.ligne small{display:block;color:var(--doux);font-size:12px}
.ligne small.motif{color:var(--rouge-doux)}
.ligne em{font-style:normal;font-size:11px;color:var(--gris);flex:none}
.ligne .badge{flex:none}
.tournee{border-color:rgba(226,27,42,.5)}
.tournee ol{margin:8px 0 0;padding-left:20px;font-size:14px}
.tournee li{padding:3px 0}

/* Fiche garage */
.voile{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:flex;justify-content:flex-end}
.fiche{width:min(460px,100%);height:100%;overflow:auto;background:var(--carte);border-left:1px solid var(--trait);
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.fiche-tete{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:start}
.vignette{width:96px;height:72px;border-radius:10px;background:linear-gradient(160deg,#1E232B,#0E1014);border:1px solid var(--trait);display:grid;place-items:center;overflow:hidden}
.fiche-tete h2{font-family:var(--f-titre);font-weight:800;font-size:24px;margin:0;line-height:1.05;overflow-wrap:anywhere}
.pastille-statut{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 9px;border-radius:5px;font-weight:600;font-size:13px}
.lieu{color:var(--doux);font-size:13px;margin-top:6px}
.fermer{width:40px;height:40px;border-radius:8px;border:1px solid var(--trait);background:none;color:var(--texte);cursor:pointer;font-size:22px;line-height:1}
.actions-fiche{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions-fiche .btn{min-height:44px;padding:0 12px;font-size:14px}
.actions-fiche .btn.principal{font-size:17px;flex:1}
.sous-onglets{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--trait)}
.sous-onglets button{background:none;border:0;border-bottom:2px solid transparent;color:var(--doux);padding:10px;cursor:pointer;font-weight:600}
.sous-onglets button[aria-selected="true"]{color:var(--neon);border-bottom-color:var(--neon)}
.champs{display:flex;flex-direction:column}
.champ{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--trait)}
.champ .n{color:var(--doux);font-size:12.5px}
.champ .val{grid-column:1;font-weight:500;overflow-wrap:anywhere}
.champ .badge{grid-row:1/3;grid-column:2;align-self:center}
.champ.vide .val{color:var(--gris);font-weight:400}
.vide-onglet{padding:24px 4px;color:var(--doux);font-size:14px}
.action{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--plateau);border:1px solid rgba(226,27,42,.6)}
.action .n{font-family:var(--f-titre);font-weight:700;letter-spacing:.1em;font-size:12px;color:var(--rouge-doux);text-transform:uppercase}

/* Personnages */
.perso{cursor:pointer}
.perso *{pointer-events:none}
.perso .zone{fill:transparent;pointer-events:all}
.perso:hover .zone,.perso:focus .zone{fill:rgba(255,255,255,.06)}
.perso .bulle{opacity:0;transition:opacity .15s;pointer-events:none}
.perso:hover .bulle,.perso:focus .bulle{opacity:1}
.perso:hover .corps,.perso:focus .corps{transform:translateY(-3px)}
.perso .corps{transition:transform .15s}
.perso:focus{outline:none}
.perso:focus .corps{filter:drop-shadow(0 0 3px #FF2D3D)}
.portraits{margin-top:14px}
.portraits-liste{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.mini{display:flex;align-items:center;gap:8px;text-align:left;padding:6px;border-radius:10px;border:1px solid var(--trait);background:var(--plateau);color:var(--texte);cursor:pointer;min-width:0}
.mini:hover{border-color:var(--doux)}
.mini span{min-width:0;font-size:12.5px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.mini small{display:block;font-size:11px;font-weight:500}
.portrait{flex:none;display:block}
.cartes-agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}

.sec-agent{padding:12px 0;border-bottom:1px solid var(--trait)}

.puces-texte{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.deux-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jauge{display:inline-flex;gap:4px;margin-top:8px}

@media (pointer:coarse){.perso .bulle{display:none}}

.choix-liste{display:flex;flex-direction:column;gap:8px}

  $('#onglets').replaceChildren(...ong.map(([k,l,ic,href]) => h('a',{class:'onglet'+(k==='simulation'?' sim':''), href, 'aria-current': (r.ecran===k || (k==='ville' && r.ecran==='a-classer')) ? 'page' : null}, icone(ic), l)));
  const mode = $('#mode'); mode.className = 'mode' + (etat.mode==='reel'?' reel':''); mode.textContent = etat.mode==='reel' ? 'Mes garages' : 'Démo';
  mode.setAttribute('aria-expanded', String(etat.donneesOuvertes));
  const d = $('#donnees'); d.hidden = !etat.donneesOuvertes; if (etat.donneesOuvertes) d.replaceChildren(panneauDonnees());
}

function monterRecherche(){

// ================= Bureau : exports EBP → pipeline → 3 actions → plan du matin pour le téléphone =================
// Logique : ebp-import.js et pipeline.js (testés). Tout reste en mémoire : rien n'est envoyé ni enregistré.
const jourIso = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
etat.ebp = { pieces:null, reglements:null, clients:null, arrete: jourIso(), erreur:{} };
const EXPORTS = [['pieces','Pièces (devis, commandes, BL, factures)','lirePieces'],['reglements','Échéancier des règlements','lireReglements'],['clients','Fichier clients','lireClientsEbp']];
async function lireTableau(f){
  const buf = await f.arrayBuffer();
  if (/\.xlsx?$/i.test(f.name)) {
    if (!window.XLSX) throw new Error('Lecteur Excel indisponible : exporte en CSV.');
    const wb = XLSX.read(buf, {type:'array'}); return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
  }
  return EbpImport.lireCsv(EbpImport.decoderTexte(buf).texte);
}
async function importerEbp(type, f){
  if (!f) return;
  delete etat.ebp.erreur[type];
  try {
    if (f.size > 50*1024*1024) throw new Error('Fichier trop gros (50 Mo maximum).');
    const fn = EXPORTS.find(x => x[0] === type)[2];
    etat.ebp[type] = Object.assign(EbpImport[fn](await lireTableau(f)), {fichier: f.name});
  } catch (e) { etat.ebp[type] = null; etat.ebp.erreur[type] = e.message; }
  connecterVille(); rendre();
}
// Ville connectée (P1–P5) : seulement si la sauvegarde du téléphone ET l'export des pièces EBP sont chargés.
function connecterVille(){
  etat.ebpVille = null;
  if (etat.mode !== 'reel' || !etat.garagesTelephone) return;
  etat.garages = VillePipeline.segmentsVille(etat.garagesTelephone, { clientsEbp: etat.ebp.clients ? etat.ebp.clients.clients : [], piecesEbp: etat.ebp.pieces ? etat.ebp.pieces.pieces : [], arrete: etat.ebp.arrete });
  let plan = null; try { plan = planBureau(); } catch (e) { plan = null; }
  if (plan) {
    const r = VillePipeline.alimenterVille(etat.garages, { plan, piecesEbp: etat.ebp.pieces.pieces, clientsEbp: etat.ebp.clients ? etat.ebp.clients.clients : [], arrete: plan.arrete });
    etat.garages = r.garages; etat.ebpVille = { arrete: plan.arrete, rapport: r.rapport };
  }
  etat.rapport = L0.rapportClassement(etat.garages);
}
function planBureau(){
  const E = etat.ebp; if (!E.pieces) return null;
  const ignorees = E.pieces.ignorees.length; // seules les pièces écartées rendent les preuves commerciales incomplètes
  return Pipeline.construirePlan({ piecesEbp:E.pieces.pieces, reglements:E.reglements ? E.reglements.reglements : [], clientsEbp:E.clients ? E.clients.clients : [],
    devisTelephone: etat.telephone ? etat.telephone.devis : [], arrete:E.arrete, aujourdhui: jourIso(), ignorees });
}
function telechargerPlan(plan){
  const a = h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(plan)],{type:'application/json'})), download:'plan-odicolor-' + plan.arrete + '.json'});
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
// Réveil du cockpit : voyants allumés / partiels / éteints selon les fichiers chargés (bureau/reveil.js, lecture seule).
function panneauReveil(plan){
  const r = Reveil.voyants({ garagesTelephone: etat.mode === 'reel' ? etat.garagesTelephone : null, telephone: etat.telephone, pieces: etat.ebp.pieces,

  const voyant = x => h('div',{class:'voyant', 'data-id':x.id, 'data-etat':x.etat, style:'display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--trait)'},
    h('i',{'aria-hidden':'true', style:`width:10px;height:10px;border-radius:50%;background:${C[x.etat][0]}` + (x.etat === 'eteint' ? '' : `;box-shadow:0 0 8px ${C[x.etat][0]}`)}),
    h('div',{style:'min-width:0'}, h('b',{style:'font-size:14px' + (x.etat === 'eteint' ? ';color:var(--doux)' : '')}, x.nom), x.valeur ? h('span',{class:'info'}, ' · ' + x.valeur) : null),
    h('span',{class:'badge ' + C[x.etat][1]}, Reveil.ETATS[x.etat]),
    x.manque ? h('small',{class:'info', style:'grid-column:2/4'}, (x.etat === 'eteint' ? 'Il manque : ' : 'Limite : ') + x.manque) : h('small',{class:'info', style:'grid-column:2/4'}, 'Source : ' + x.source));
  return h('section',{class:'bloc reveil'}, h('div',{class:'titre-bloc'},'Réveil du cockpit'),
    h('p',{class:'sous'}, r.allumes + ' allumé(s) · ' + r.partiels + ' partiel(s) · ' + r.eteints + ' éteint(s) sur ' + r.total + ' voyants'),
    r.groupes.map(gr => h('details',{class:'info', open: gr.id !== 'avenir' ? '' : null, style:'margin-top:12px'}, h('summary',{style:'font-weight:700;color:var(--texte)'}, gr.titre + ' · ' + gr.voyants.filter(x => x.etat === 'allume').length + '/' + gr.voyants.length),
      gr.voyants.map(voyant))));
}
function vueBureau(){
  const E = etat.ebp, e2 = v => euros(Math.round(v * 100) / 100);
  const champ = ([type, lib]) => { const r = E[type], id = 'ebp-' + type;
    return h('div',{class:'champ-ebp'},
      h('label',{class:'btn', for:id}, (r ? '✓ ' : '') + lib, h('input',{type:'file', id, accept:'.csv,.txt,.xlsx,.xls', hidden:true, onchange:ev => { const f = ev.target.files[0]; ev.target.value = ''; importerEbp(type, f); }})),

      r ? h('details',{class:'info'}, h('summary',{}, `${r.fichier} : ${r.lues} ligne(s) lue(s), ${r.ignorees.length} écartée(s)`),
        h('p',{}, 'Colonnes retenues : ' + r.correspondance.map(c => c.libelle + ' ← « ' + c.colonne + ' »').join(' · ')),
        r.ignorees.length ? h('ul',{}, r.ignorees.slice(0, 50).map(x => h('li',{}, 'Ligne ' + x.ligne + ' : ' + x.motif))) : null,
        type === 'pieces' && !r.liens ? h('div',{class:'message erreur'}, 'Colonne « pièce d’origine » absente : impossible de relier devis, commandes, livraisons et factures. Les retards ne sont pas fiables.') : null,
        r.avoirs && r.avoirs.length ? h('p',{}, r.avoirs.length + ' avoir(s) lu(s), non déduit(s) du CA (règle à valider) : ' + r.avoirs.map(x => x.no).join(', ')) : null) : null); };
  const imports = h('section',{class:'bloc'}, h('div',{class:'titre-bloc'},'Exports EBP'),
    h('p',{class:'info'}, 'Charge tes exports EBP (CSV ou Excel). Lecture seule : rien n’est modifié ni envoyé. ',
      etat.telephone ? h('b',{}, (etat.telephone.devis || []).length + ' devis du téléphone pris en compte.') : 'Charge aussi ta sauvegarde téléphone (bouton Démo / Mes garages) pour relier tes devis.'),
    h('label',{class:'info', for:'ebp-arrete'}, 'Date de l’export EBP '), h('input',{type:'date', id:'ebp-arrete', class:'recherche', value:E.arrete, max:jourIso(), onchange:ev => { E.arrete = ev.target.value; connecterVille(); rendre(); }}),
    h('div',{class:'deps'}, EXPORTS.map(champ)));
  let plan = null, erreur = '';
  try { plan = planBureau(); } catch (e) { erreur = e.message; }
  if (!plan) return h('div',{class:'ecran'}, h('div',{class:'panneau'}, imports, panneauReveil(null), erreur ? h('div',{class:'message erreur'}, erreur) :
    h('section',{class:'bloc'}, h('h2',{},'Ta journée'), h('p',{class:'sous'},'Charge au moins l’export des pièces EBP pour voir tes 3 actions et ton CA réel.'))));
  const k = plan.kpi, top = plan.actions.filter(a => a.prio === 1), suite = plan.actions.filter(a => a.prio > 1);
  const action = (a, i) => h('div',{class:'action'}, h('div',{class:'n'}, (i + 1) + ' · ' + a.tag + ' · ' + a.responsable),
    h('b',{}, a.t), h('p',{class:'info', style:'margin:4px 0 0'}, a.d), h('details',{class:'info'}, h('summary',{},'Preuve'), h('p',{}, a.preuve), h('p',{}, a.source + ' · ' + a.qualite)));
  const chiffre = (l, v, b, s) => h('div',{class:'chiffre'}, h('div',{class:'v'}, v), h('div',{class:'l'}, l, h('span',{class:'badge ' + b[0]}, b[1])), s ? h('small',{class:'info'}, s) : null);
  const ebpB = ['b-confirme','EBP'];
  return h('div',{class:'ecran'},
    h('div',{class:'panneau'},
      h('section',{class:'bloc'}, h('h2',{},'Tes 3 actions'), h('p',{class:'sous'}, 'Classées par montant en jeu · export EBP du ' + plan.arrete),

        suite.length ? h('details',{class:'info', style:'margin-top:12px'}, h('summary',{}, suite.length + ' autre(s) action(s) à suivre'), suite.map((a, i) => action(a, i + 3))) : null),
      plan.changement ? h('section',{class:'bloc'}, h('div',{class:'titre-bloc'},'Un seul changement cette semaine'), h('p',{}, plan.changement.texte), h('small',{class:'info'}, plan.changement.mesure)) : null,
      panneauReveil(plan)),
    h('div',{class:'panneau'},
      h('section',{class:'bloc'}, h('div',{class:'titre-bloc'},'Où j’en suis'), h('div',{class:'chiffres'},

        k.echu ? chiffre('Échu non réglé', e2(k.echu.reste), ebpB, k.echu.n + ' facture(s)' + (k.echu.aVerifier ? ' · ' + k.echu.aVerifier + ' à vérifier' : ''))
               : chiffre('Échu non réglé', '—', ['b-vide','Non vérifiable'], 'Charge l’échéancier EBP')),
        h('p',{class:'regle'}, 'Objectif : à fixer avec Faizal (non renseigné). Marge : non calculable sans les prix d’achat EBP.')),
      h('section',{class:'bloc'}, h('div',{class:'titre-bloc'},'Plan du matin pour le téléphone'),
        h('p',{class:'info'}, plan.actions.length + ' action(s), ' + plan.clients.length + ' fiche(s) client, chiffres EBP. Sur le téléphone : Réglages → Imports → Plan PC.'),
        plan.rapprochements.length ? h('p',{class:'info'}, plan.rapprochements.length + ' pièce(s) du téléphone reconnue(s) dans EBP (non comptées deux fois) : ' + plan.rapprochements.map(r => r.telephone + ' = ' + r.ebp).join(', ') + '.') : null,
        plan.sources.preuvesCommerciales.restrictions.map(t => h('div',{class:'message erreur'}, t)),
        h('button',{class:'btn principal plein', onclick:() => telechargerPlan(plan)}, 'Télécharger le plan du matin')),

}

// ================= Navigation =================
function route(){
  const hs = location.hash, m = /^#carte-(\d\d)(?:-([a-z]+))?$/.exec(hs);
  if (m && L0.depInfo(m[1])) { const D = L0.depInfo(m[1]); return {ecran:'carte', D, porte: m[2] ? TERRITOIRES.find(x=>x.id===m[2] && x.dep===D.dep) : null}; }
  if (hs === '#simulation') return {ecran:'simulation'};
  if (hs === '#bureau') return {ecran:'bureau'};
  if (hs === '#a-classer') return {ecran:'a-classer'};
  return {ecran:'ville'};
}
function choisir(id){ etat.choix = id; rendre(); }
function allerCarte(dep, porteId){ etat.recherche=''; etat.commune=''; location.hash = 'carte-' + dep + (porteId ? '-' + porteId : ''); }
function rendre(){
  const r = route();
  if (r.porte) etat.choix = r.porte.id;
  if (r.ecran !== 'carte' && carte) { carte.remove(); carte = null; }
  rendreEntete(); rendreKpis(); rendreFiltres();
  $('#kpis').hidden = r.ecran === 'simulation' || r.ecran === 'bureau';
  $('#vue').replaceChildren(r.ecran==='carte' ? vueCarte(r.D, r.porte) : r.ecran==='simulation' ? vueSimulation() : r.ecran==='bureau' ? vueBureau() : r.ecran==='a-classer' ? vueAClasser() : vueVille());
  rendreFil();
  const sc = document.getElementById('scene'); if (sc && sc.scrollWidth > sc.clientWidth) { const t = TERRITOIRES.find(x=>x.id===etat.choix), [px] = iso(...pos(t)); sc.scrollLeft = (px + 495) / 990 * sc.scrollWidth - sc.clientWidth/2; }
}

// ================= Import (lecture seule) =================
// Lit .odicolor (intégrité vérifiée) ou ancien .json. En cas de refus, les garages affichés
// jusque-là restent affichés : un mauvais fichier ne fait jamais perdre ce qui était chargé.
async function importer(f){
  if (!f || etat.lecture) return;
  etat.lecture = true; etat.message = {texte:'Vérification de « ' + f.name + ' »…'}; rendre();
  try {
    const r = await window.LectureSauvegarde.lire(f);
    etat.telephone = r.telephone; // devis du téléphone : utilisés par l'écran Bureau (pipeline)
    etat.garagesTelephone = r.garages; // fiches d'origine, jamais modifiées
    Object.assign(etat, {mode:'reel', garages:r.garages, rapport:r.rapport, tournee:[], filtre:'tous',
      message:{texte: window.LectureSauvegarde.message(r.rapport)}});
  } catch (e) {
    etat.message = {erreur:true, texte:'Fichier refusé : ' + (e && e.message ? e.message : 'lecture impossible.') +
      (etat.mode === 'reel' ? ' Les garages déjà chargés restent affichés.' : ' La démo reste affichée.')};
  } finally { etat.lecture = false; }
  connecterVille(); rendre();
}
function retourDemo(){ const g = L0.garagesDemo(2026); Object.assign(etat,{mode:'demo', garages:g, rapport:L0.rapportClassement(g), tournee:[], message:null, ebpVille:null, garagesTelephone:null}); rendre(); }

$('#mode').addEventListener('click', () => { etat.donneesOuvertes = !etat.donneesOuvertes; rendreEntete(); });
window.addEventListener('hashchange', () => { const c = $('#couche-fiche'); c.hidden = true; c.replaceChildren(); rendre(); });
monterRecherche();
rendre();
})();

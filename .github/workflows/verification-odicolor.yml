name: Vérification ODICOLOR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/lot1-f01-f03-recuperation]

concurrency:
  group: odicolor-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  securite-et-syntaxe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier tous les scripts chargés par l'application
        shell: bash
        run: |
          node <<'NODE'
          const {readFileSync}=require('node:fs');
          const {execFileSync}=require('node:child_process');
          const html=readFileSync('index.html','utf8');
          const files=[...html.matchAll(/<script src="([^"]+)"[^>]*><\/script>/g)].map(m=>m[1].split('?')[0]);
          files.push('sw.js');
          if(files.length<10)throw Error('Scripts absents de index.html');
          for(const f of files){
            execFileSync(process.execPath,['--check',f],{stdio:'inherit'});
            console.log('OK',f);
          }
          NODE
      - name: Vérifier la construction PWA reproductible
        run: node scripts/build-pwa.cjs --check
      - name: Tester validation, sauvegarde et restauration atomique
        run: node --test tests/*.test.cjs
      - name: Générer et vérifier le jeu synthétique de volume
        shell: bash
        run: |
          node scripts/generer-jeu-synthetique.cjs terrain "$RUNNER_TEMP/odicolor-terrain"
          node scripts/verifier-sauvegarde.cjs "$RUNNER_TEMP/odicolor-terrain/jeu-terrain.odicolor" "$RUNNER_TEMP/odicolor-terrain/attendus-terrain.json" > "$RUNNER_TEMP/verification-terrain.json"
      - name: Installer le navigateur de test (aucune dépendance de production)
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Tester la récupération avec IndexedDB réel et les modules complets
        run: |
          node tests/backup-browser.cjs
          node tests/pwa-browser.cjs
      - name: Préparer les paquets Samsung (aucun déploiement)
        run: >-
          node scripts/preparer-preview-samsung.cjs
          "${{ runner.temp }}/preview-samsung"
          https://odicolor-test-pr2-20261028-a.pages.dev
          https://odicolor-test-pr2-20261028-b.pages.dev
      - name: Conserver le ZIP de l’espace A
        uses: actions/upload-artifact@v4
        with:
          name: odicolor-test-pr2-20261028-a
          path: ${{ runner.temp }}/preview-samsung/a/
          if-no-files-found: error
          retention-days: 7
      - name: Conserver le ZIP de l’espace B
        uses: actions/upload-artifact@v4
        with:
          name: odicolor-test-pr2-20261028-b
          path: ${{ runner.temp }}/preview-samsung/b/
          if-no-files-found: error
          retention-days: 7
      - name: Conserver le ZIP du guide Samsung
        uses: actions/upload-artifact@v4
        with:
          name: odicolor-test-pr2-20261028-guide
          path: ${{ runner.temp }}/preview-samsung/guide/
          if-no-files-found: error
          retention-days: 7
